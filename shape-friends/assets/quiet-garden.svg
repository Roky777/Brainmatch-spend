<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <title>A quiet orchard clearing</title>
  <desc>Original vector scenery with one continuous lawn, distant hedges and two framing orchard trees. The middle is deliberately quiet for the game.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b8dce3"/><stop offset="1" stop-color="#e9efcf"/></linearGradient>
    <linearGradient id="lawn" x2="0" y2="1"><stop stop-color="#c6dca9"/><stop offset="1" stop-color="#a6c790"/></linearGradient>
    <linearGradient id="leaf" x2=".7" y2="1"><stop stop-color="#a9c995"/><stop offset="1" stop-color="#72a58a"/></linearGradient>
    <g id="daisy" stroke="#7a9d75" stroke-width="3" stroke-linecap="round">
      <path d="M0 0q-4 12-2 24m0-6q-9 0-11-7" fill="none"/>
      <g fill="#fff5d9" stroke="none"><ellipse cy="-7" rx="4" ry="7"/><ellipse cy="7" rx="4" ry="7"/><ellipse cx="-7" rx="7" ry="4"/><ellipse cx="7" rx="7" ry="4"/><circle r="4" fill="#e8c77e"/></g>
    </g>
  </defs>
